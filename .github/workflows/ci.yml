name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify expensive acceptance
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            configurations:
              - added|modified|deleted:
                  - '.github/workflows/**'
                  - 'ankh.config.json'
                  - 'zora.web.json'
                  - 'next.config.*'
                  - 'tsconfig*.json'
                  - 'package.json'
                  - 'bun.lock'
            jvm:
              - added|modified|deleted:
                  - 'bin/**'
                  - 'src/cli/**'
                  - 'src/features/audit/application/**'
                  - 'src/features/audit/composition/**'
                  - 'src/features/audit/domain/**'
                  - 'src/features/dependency-analysis/**'
                  - 'src/features/project-analysis/**'
                  - 'src/features/project-source/**'
                  - 'src/types/audit.ts'
                  - 'src/types/cli.ts'
                  - 'src/utils/getProjectName.ts'
                  - 'src/utils/parseProjectPath.ts'
                  - 'maven-plugin/**'
                  - 'gradle-plugin/**'
            offline_browser:
              - added|modified|deleted:
                  - 'bin/**'
                  - 'src/**'
                  - 'test/e2e/offlineWorkspace.ts'
                  - 'examples/java/my-app/**'
                  - 'test/fixtures/**'
            compound_browser:
              - added|modified|deleted:
                  - 'bin/**'
                  - 'src/app/**'
                  - 'src/features/graph-view/**'
                  - 'src/features/offline-export/**'
                  - 'src/features/settings/**'
                  - 'src/features/theme/**'
                  - 'src/features/workspace/**'
                  - 'src/i18n/**'
                  - 'src/types/**'
                  - 'test/e2e/compoundSelectionBrowser.ts'
                  - 'test/e2e/compoundSelectionHarness.tsx'
                  - 'test/e2e/offlineWorkspace.ts'
                  - 'test/fixtures/typescript/compound-selection/**'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.configurations == 'true' || steps.changes.outputs.jvm == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: maven-plugin/pom.xml

      - name: Setup Gradle
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.configurations == 'true' || steps.changes.outputs.jvm == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping."
          fi

      - name: Validate opted-in APM owner release
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.ankh?.apm === undefined ? 1 : 0)"; then
            bun run test:apm
            ./node_modules/.bin/ankhorage-apm-release validate . --allow-owner-code
          fi

      - name: Validate Ankhorage repository
        run: BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.13.1 validate .

      - name: Validate generated documentation
        run: bun run docs

      - name: Run lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            bun run lint
          else
            echo "No lint script found; skipping."
          fi

      - name: Run format check
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['format:check'] ? 0 : 1)"; then
            bun run format:check
          else
            echo "No format:check script found; skipping."
          fi

      - name: Run Knip
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['knip:check'] ? 0 : 1)"; then
            bun run knip:check
          else
            echo "No knip:check script found; skipping."
          fi

      - name: Run tests
        run: bun run test:unit

      - name: Run Maven adapter tests
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.configurations == 'true' || steps.changes.outputs.jvm == 'true'
        run: bun run test:maven

      - name: Run Gradle adapter tests
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.configurations == 'true' || steps.changes.outputs.jvm == 'true'
        run: bun run test:gradle

      - name: Verify offline workspace in an isolated browser
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.configurations == 'true' || steps.changes.outputs.offline_browser == 'true'
        env:
          ATLAS_PROJECT_PATH: ${{ github.workspace }}/examples/java/my-app
        run: |
          bun bin/atlas.ts examples/java/my-app --offline --out offline-smoke.html
          export ATLAS_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$ATLAS_CHROME"
          bun run start > next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid"; rm -f offline-smoke.html next.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          ATLAS_ONLINE_URL=http://127.0.0.1:3000/ bun run test:offline-browser

      - name: Verify compound selection browser acceptance
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.configurations == 'true' || steps.changes.outputs.compound_browser == 'true'
        env:
          ATLAS_PROJECT_PATH: ${{ github.workspace }}/test/fixtures/typescript/compound-selection
          ATLAS_PROJECT_NAME: compound-selection
        run: |
          export ATLAS_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$ATLAS_CHROME"
          bun run test:compound-selection-browser
          bun bin/atlas.ts test/fixtures/typescript/compound-selection --offline --out compound-selection.html
          ATLAS_OFFLINE_REPORT=compound-selection.html ATLAS_PROJECT_NAME=compound-selection ATLAS_REQUIRE_COMPOUND_NODES=true bun run test:offline-browser
          rm -f compound-selection.html

      - name: Verify multi-project browser acceptance
        run: |
          export ATLAS_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$ATLAS_CHROME"
          bun run test:multi-project-browser

      - name: Retain multi-project browser acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-project-browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-acceptance/
          if-no-files-found: warn

      - name: Run typecheck
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then
            bun run typecheck
          else
            echo "No typecheck script found; skipping."
          fi

      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: |
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          export ANKH_PR_CHANGESET_FILES
          ANKH_PR_CHANGESET_FILES="$(git diff --name-only --diff-filter=AMCR "$base_sha" "$head_sha" -- .changeset)"
          if [ -z "$ANKH_PR_CHANGESET_FILES" ]; then
            echo "No pull-request-owned Changeset files; no release requested."
            exit 0
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const files = process.env.ANKH_PR_CHANGESET_FILES.split("\n").filter(Boolean);
            const empty = files.filter((file) => {
              if (!/^\.changeset\/[^/]+\.md$/u.test(file) || file === ".changeset/README.md") return false;
              const match = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/u.exec(readFileSync(file, "utf8"));
              return match?.[1].trim() === "";
            });
            if (empty.length > 0) {
              throw new Error("Empty Changesets are not supported. Remove " + empty.join(", ") + " for a no-release PR, or add release intent.");
            }
          '
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['changeset:status'] ? 0 : 1)"; then
            bun run changeset:status
          else
            echo "No changeset:status script found; skipping validation."
          fi
