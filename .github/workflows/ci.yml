name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        env:
          NEXT_PUBLIC_PROJECT_PATH: ${{ github.workspace }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping."
          fi

      - name: Validate opted-in APM owner release
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.ankh?.apm === undefined ? 1 : 0)"; then
            bun run test:apm
            ./node_modules/.bin/ankhorage-apm-release validate . --allow-owner-code
          fi

      - name: Validate Ankhorage repository
        run: BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.13.1 validate .

      - name: Validate generated documentation
        run: bun run docs

      - name: Run lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            bun run lint
          else
            echo "No lint script found; skipping."
          fi

      - name: Run format check
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['format:check'] ? 0 : 1)"; then
            bun run format:check
          else
            echo "No format:check script found; skipping."
          fi

      - name: Run Knip
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['knip:check'] ? 0 : 1)"; then
            bun run knip:check
          else
            echo "No knip:check script found; skipping."
          fi

      - name: Run tests
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            bun run test
          else
            echo "No test script found; skipping."
          fi

      - name: Verify offline report in browser
        run: |
          bun bin/atlas.ts examples/java/my-app --offline --out offline-smoke.html
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 30s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-background-networking \
            --disable-component-update \
            --disable-default-apps \
            --disable-sync \
            --host-resolver-rules="MAP * 0.0.0.0" \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/offline-smoke.html" > offline-smoke-dom.html
          grep -F "Atlas · my-app" offline-smoke-dom.html
          grep -F "Project tree" offline-smoke-dom.html
          grep -E "[0-9]+ nodes · [0-9]+ edges" offline-smoke-dom.html
          rm offline-smoke.html offline-smoke-dom.html

      - name: Run typecheck
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then
            bun run typecheck
          else
            echo "No typecheck script found; skipping."
          fi

      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: |
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          export ANKH_PR_CHANGESET_FILES
          ANKH_PR_CHANGESET_FILES="$(git diff --name-only --diff-filter=AMCR "$base_sha" "$head_sha" -- .changeset)"
          if [ -z "$ANKH_PR_CHANGESET_FILES" ]; then
            echo "No pull-request-owned Changeset files; no release requested."
            exit 0
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const files = process.env.ANKH_PR_CHANGESET_FILES.split("\n").filter(Boolean);
            const empty = files.filter((file) => {
              if (!/^\.changeset\/[^/]+\.md$/u.test(file) || file === ".changeset/README.md") return false;
              const match = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/u.exec(readFileSync(file, "utf8"));
              return match?.[1].trim() === "";
            });
            if (empty.length > 0) {
              throw new Error("Empty Changesets are not supported. Remove " + empty.join(", ") + " for a no-release PR, or add release intent.");
            }
          '
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['changeset:status'] ? 0 : 1)"; then
            bun run changeset:status
          else
            echo "No changeset:status script found; skipping validation."
          fi
