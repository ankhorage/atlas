name: Refresh branch lockfile

on:
  push:
    branches:
      - fix/github-repository-input

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-repository-input
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Refresh dependencies after npm propagation
        run: |
          for attempt in {1..24}; do
            if bun install; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): update @ankhorage/utility lockfile"
          git push origin HEAD:fix/github-repository-input
