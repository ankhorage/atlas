name: Publish PKGViz 0.8.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.head_ref == 'release/pkgviz-0.8.3'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publish artifact
        env:
          NEXT_PUBLIC_PROJECT_PATH: ${{ github.workspace }}
        run: bun run build

      - name: Check registry
        id: registry
        run: |
          if npm view pkgviz@0.8.3 version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with an authorized existing npm credential
        if: steps.registry.outputs.exists != 'true'
        env:
          CANDIDATE_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANDIDATE_NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          CANDIDATE_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          CANDIDATE_NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          CANDIDATE_NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          CANDIDATE_NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          CANDIDATE_PKGVIZ_NPM_TOKEN: ${{ secrets.PKGVIZ_NPM_TOKEN }}
          CANDIDATE_NPM_PKGVIZ_TOKEN: ${{ secrets.NPM_PKGVIZ_TOKEN }}
          CANDIDATE_ARTIPHISHLE_NPM_TOKEN: ${{ secrets.ARTIPHISHLE_NPM_TOKEN }}
        run: |
          try_publish() {
            name="$1"
            token="$2"
            if [ -z "$token" ]; then
              echo "$name: not configured"
              return 1
            fi

            echo "::add-mask::$token"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$token" > "$HOME/.npmrc"
            identity="$(npm whoami 2>/dev/null || true)"
            if [ -z "$identity" ]; then
              echo "$name: configured but authentication failed"
              return 1
            fi

            echo "$name: authenticated as $identity"
            if npm publish --access public --provenance; then
              echo "$name: publication succeeded"
              return 0
            fi

            echo "$name: authenticated but cannot publish pkgviz@0.8.3"
            return 1
          }

          published=false
          try_publish NPM_TOKEN "$CANDIDATE_NPM_TOKEN" && published=true
          if [ "$published" != true ]; then try_publish NODE_AUTH_TOKEN "$CANDIDATE_NODE_AUTH_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish NPM_AUTH_TOKEN "$CANDIDATE_NPM_AUTH_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish NPM_PUBLISH_TOKEN "$CANDIDATE_NPM_PUBLISH_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish NPMJS_TOKEN "$CANDIDATE_NPMJS_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish NPM_ACCESS_TOKEN "$CANDIDATE_NPM_ACCESS_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish PKGVIZ_NPM_TOKEN "$CANDIDATE_PKGVIZ_NPM_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish NPM_PKGVIZ_TOKEN "$CANDIDATE_NPM_PKGVIZ_TOKEN" && published=true; fi
          if [ "$published" != true ]; then try_publish ARTIPHISHLE_NPM_TOKEN "$CANDIDATE_ARTIPHISHLE_NPM_TOKEN" && published=true; fi

          if [ "$published" != true ]; then
            echo "::error title=npm pkgviz publish credential required::No configured npm credential can publish pkgviz@0.8.3."
            exit 1
          fi

      - name: Verify published release
        run: test "$(npm view pkgviz@0.8.3 version)" = "0.8.3"
